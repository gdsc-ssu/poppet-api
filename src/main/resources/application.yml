spring:
  config:
    import:
      - optional:file:.env
      - optional:file:.env.properties
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  sql:
    init:
      platform: mysql
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    generate-ddl: true
    show-sql: true
    properties:
      format_sql: true
  servlet:
    multipart:
      max-file-size: 7MB
      max-request-size: 7MB
  cloud:
    gcp:
      credentials:
        location: ${GOOGLE_APPLICATION_CREDENTIALS}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          timeout: 5000
          ssl: false
          starttls:
            enable: true
            required: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "http://localhost:8080/auth/login/google"
            scope:
              - openid
              - profile
              - email
              - https://www.googleapis.com/auth/user.birthday.read
              - https://www.googleapis.com/auth/user.gender.read
        provider:
          google:
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo

ai:
  gemini:
    base-host: generativelanguage.googleapis.com
    key: ${AI_GEMINI_API_KEY}
    location:
      chat: ${AI_GEMINI_CHAT_PROMPT_LOCATION}
      summary: ${AI_GEMINI_SUMMARY_PROMPT_LOCATION}

kakao:
  auth:
    client: ${KAKAO_CLIENT_ID}
    redirect: http://localhost:8080/auth/login/kakao

logging:
  level:
    org.springframework.web: DEBUG

jwt:
  secretKey: ${JWT_SECRET_KEY}
  access:
    expiration: 3600000 # 1시간(60분) (1000L(ms -> s) * 60L(s -> m) * 60L(m -> h))
    header: Authorization
  refresh:
    expiration: 1209600000 #  (1000L(ms -> s) * 60L(s -> m) * 60L(m -> h) * 24L(h -> 하루) * 14(2주))
    header: Authorization-refresh