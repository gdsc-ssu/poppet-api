spring:
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  sql:
    init:
      platform: mysql
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    generate-ddl: true
    show-sql: true
    properties:
      format_sql: true

  cloud:
    gcp:
      credentials:
        # GCP 인증 파일은 깃허브 Secrets에 파일 내용을 저장 후
        # GitHub Actions에서 임시로 poppet-client.json 생성하여 사용
        location: file:./poppet-client.json

ai:
  gemini:
    base-host: generativelanguage.googleapis.com
    key: ${AI_GEMINI_API_KEY}   # 민감 정보는 환경 변수로 주입

kakao:
  auth:
    client: ${KAKAO_CLIENT_ID}
    redirect: http://localhost:8080/auth/login/kakao

logging:
  level:
    org.springframework.web: DEBUG
