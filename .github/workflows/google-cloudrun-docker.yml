name: 'Build and Deploy to Cloud Run'

on:
  push:
    branches: [ "develop" ]

env:
  PROJECT_ID: 'poppet-sol4' 
  REGION: 'asia-northeast3'
  SERVICE: 'poppet-sol4'
  WORKLOAD_IDENTITY_PROVIDER: 'projects/162314042262/locations/global/workloadIdentityPools/poppet-github-actions/providers/poppet-github-actions'

jobs:
  deploy:
    runs-on: 'ubuntu-latest'

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      # 1) 소스 체크아웃
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      # 2) Workload Identity Federation 설정 후 GCP 인증
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: 'poppet-client@poppet-sol4.iam.gserviceaccount.com'

      # 3) Gradle로 Spring Boot 빌드
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar

      # 4) 빌드 후 JAR 파일 경로 확인
      - name: Show Jar files
        run: find . -name "*.jar"

      ################################################################
      # 5) .env 파일 생성 (GitHub Secrets -> .env)
      ################################################################
      - name: Create .env file
        run: |
          echo "DB_URL=${{ secrets.DB_URL }}" >> .env
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "AI_GEMINI_API_KEY=${{ secrets.AI_GEMINI_API_KEY }}" >> .env
          echo "KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}" >> .env
          echo "GCP_CREDENTIALS_JSON=${{ secrets.GCP_CREDENTIALS_JSON }}" >> .env
      ################################################################

      # 6) Dockerfile 복호화 (Secrets에서 가져옴)
      - name: Decode Dockerfile from secret and save it
        run: |
          echo "$DOCKERFILE" > Dockerfile
        env:
          DOCKERFILE: ${{ secrets.DOCKERFILE }}

      # 7) Artifact Registry 로그인
      - name: 'Docker Auth'
        uses: 'docker/login-action@v3'
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.auth_token }}'
          registry: '${{ env.REGION }}-docker.pkg.dev'

      # 8) Docker 빌드 & 푸시
      - name: 'Build and Push Container'
        run: |-
          # 8-1) 로그인
          gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin https://asia-northeast3-docker.pkg.dev

          # 8-2) Docker TAG
          DOCKER_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/poppet-api:${{ github.sha }}"

          # 8-3) Build container – pass .env or load .env in Docker build
          docker build --tag "${DOCKER_TAG}" .

          # 8-4) Push
          docker push "${DOCKER_TAG}"

      # 9) Cloud Run 배포
      - name: 'Deploy to Cloud Run'
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: 'poppet-sol4-server'
          region: '${{ env.REGION }}'
          image: '${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/poppet-api:${{ github.sha }}'

      # 10) 배포 후 URL 출력
      - name: 'Show output'
        run: |
          echo ${{ steps.deploy.outputs.url }}
